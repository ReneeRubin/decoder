name = "rueckenbewusst-decoder"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Server-seitige Environment-Variablen für lokale Entwicklung (`wrangler pages dev`).
# Produktiv werden BREVO_API_KEY etc. ausschließlich im Cloudflare Pages
# Dashboard als (verschlüsseltes) Secret gesetzt – NICHT hier, NICHT in Git.
[vars]
BREVO_LIST_ID = "24"
QUIZ_VERSION = "v1"

# Digistore24-VIP-Webhook (functions/api/digistore24-webhook.ts).
# DIGISTORE24_IPN_PASSPHRASE ist NICHT hier eingetragen – die gehört
# ausschließlich als Cloudflare Secret ins Dashboard (siehe docs/digistore24-webhook-setup.md).
BREVO_VIP_LIST_ID = "26"
BREVO_VIP_ATTRIBUTE_VALUE = "vipaktiv"
DIGISTORE24_VIP_PRODUCT_ID = "734497"
